<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Category</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        h1 {
            margin-bottom: 20px;
        }

        .category-form {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .add-btn {
            background: #222;
            color: white;
        }

        .category-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .category {
            border: 1px solid #ddd;
            padding: 18px;
            border-radius: 8px;
        }

        .category h3 {
            margin-top: 0;
        }

        .products {
            color: #666;
            margin-bottom: 15px;
        }

        .edit {
            background: #ddd;
        }

        .delete {
            background: #eee;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Category Management</h1>

    <!-- Add Category -->
    <div class="category-form">
        <input type="text" placeholder="Enter category name">
        <button class="add-btn">Add Category</button>
    </div>

    <h2>Product Categories</h2>

    <div class="category-list">

        <!-- Clothes -->
        <div class="category">
            <h3>Clothes</h3>
            <div class="products">
                Crop Top<br>
                Oversized Shirt<br>
                Denim Pants
            </div>

            <button class="edit">Edit</button>
            <button class="delete">Delete</button>
        </div>

        <!-- Accessories -->
        <div class="category">
            <h3>Accessories</h3>
            <div class="products">
                Necklace<br>
                Bracelet<br>
                Hair Clip
            </div>

            <button class="edit">Edit</button>
            <button class="delete">Delete</button>
        </div>

        <!-- Perfumes -->
        <div class="category">
            <h3>Perfumes</h3>
            <div class="products">
                Rose Perfume<br>
                Vanilla Perfume
            </div>

            <button class="edit">Edit</button>
            <button class="delete">Delete</button>
        </div>

        <!-- Makeup -->
        <div class="category">
            <h3>Makeup</h3>
            <div class="products">
                Lipstick<br>
                Lip Tint<br>
                Blush
            </div>

            <button class="edit">Edit</button>
            <button class="delete">Delete</button>
        </div>

    </div>

</div>

</body>
</html>
