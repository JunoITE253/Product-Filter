<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Luxe - Categories</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f8f6f3;
            color: #333;
        }

        .header {
            background: #ffffff;
            padding: 20px 50px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #e5e5e5;
        }

        .logo {
            font-size: 26px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .header-title {
            font-size: 20px;
            font-weight: 600;
        }

        .container {
            max-width: 1100px;
            margin: 50px auto;
            padding: 0 25px;
        }

        .page-title {
            text-align: center;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 40px;
        }

        .category-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .category-button {
            height: 180px;
            border: 1px solid #e5e5e5;
            border-radius: 15px;
            background: #ffffff;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            transition: 0.25s ease;
        }

        .category-button:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 22px rgba(0,0,0,0.10);
        }

        .category-icon {
            width: 48px;
            height: 48px;
            color: #222;
        }

        .category-icon svg {
            width: 100%;
            height: 100%;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .category-name {
            font-size: 20px;
            font-weight: 600;
        }

        .category-description {
            font-size: 13px;
            color: #888;
        }

        @media (max-width: 800px) {
            .category-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 500px) {
            .category-grid {
                grid-template-columns: 1fr;
            }

            .header {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <header class="header">
        <div class="logo">LOVE LUXE</div>
        <div class="header-title">Categories</div>
    </header>

    <main class="container">

        <h1 class="page-title">Shop by Category</h1>

        <p class="subtitle">
            Choose a category to explore our collection
        </p>

        <div class="category-grid">

            <button class="category-button" onclick="categoryClicked('Clothes')">
                <div class="category-icon">
                    <svg viewBox="0 0 24 24">
                        <path d="M9 4l3 2 3-2 5 4-3 4-2-2v10H9V10l-2 2-3-4z"/>
                    </svg>
                </div>
                <div class="category-name">Clothes</div>
                <div class="category-description">Fashion & Apparel</div>
            </button>

            <button class="category-button" onclick="categoryClicked('Shoes')">
                <div class="category-icon">
                    <svg viewBox="0 0 24 24">
                        <path d="M4 17c2-1 4-3 5-7l2-2 2 4c1 2 3 3 6 4 1 .3 1 1 1 2v1H4z"/>
                        <path d="M9 10l2 2"/>
                    </svg>
                </div>
                <div class="category-name">Shoes</div>
                <div class="category-description">Footwear Collection</div>
            </button>

            <button class="category-button" onclick="categoryClicked('Bags')">
                <div class="category-icon">
                    <svg viewBox="0 0 24 24">
                        <rect x="4" y="8" width="16" height="12" rx="2"/>
                        <path d="M8 8V6a4 4 0 0 1 8 0v2"/>
                    </svg>
                </div>
                <div class="category-name">Bags</div>
                <div class="category-description">Bags & Accessories</div>
            </button>

            <button class="category-button" onclick="categoryClicked('Accessories')">
                <div class="category-icon">
                    <svg viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="7"/>
                        <circle cx="12" cy="12" r="2"/>
                    </svg>
                </div>
                <div class="category-name">Accessories</div>
                <div class="category-description">Jewelry & More</div>
            </button>

            <button class="category-button" onclick="categoryClicked('Beauty')">
                <div class="category-icon">
                    <svg viewBox="0 0 24 24">
                        <path d="M9 3h6"/>
                        <path d="M10 3v5l-4 10a2 2 0 0 0 2 3h8a2 2 0 0 0 2-3L14 8V3"/>
                        <path d="M8 15h8"/>
                    </svg>
                </div>
                <div class="category-name">Beauty</div>
                <div class="category-description">Beauty Products</div>
            </button>

            <button class="category-button" onclick="categoryClicked('Others')">
                <div class="category-icon">
                    <svg viewBox="0 0 24 24">
                        <circle cx="5" cy="12" r="1"/>
                        <circle cx="12" cy="12" r="1"/>
                        <circle cx="19" cy="12" r="1"/>
                    </svg>
                </div>
                <div class="category-name">Others</div>
                <div class="category-description">More Products</div>
            </button>

        </div>

    </main>

    <script>
        function categoryClicked(category) {
            alert(category + " category selected.");
        }
    </script>

</body>
</html>
