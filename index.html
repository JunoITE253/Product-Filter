<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Luxe - Product Search</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f8f6f3;
            margin: 0;
            padding: 30px;
        }

        h1 {
            text-align: center;
        }

        .search {
            max-width: 600px;
            margin: 25px auto;
            display: flex;
            gap: 10px;
        }

        input, select {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        input {
            flex: 1;
        }

        select {
            background: white;
        }

        .products {
            max-width: 900px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .product {
            background: white;
            padding: 25px;
            border: 1px solid #ddd;
            border-radius: 8px;
            text-align: center;
        }

        .product h3 {
            margin-bottom: 10px;
        }

        .product p {
            color: #666;
        }

        @media (max-width: 700px) {
            .products {
                grid-template-columns: 1fr;
            }

            .search {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <h1>Products</h1>

    <div class="search">
        <input type="text" id="search" placeholder="Search product...">

        <select id="filter">
            <option value="all">All</option>
            <option value="soap">Soap</option>
            <option value="bag">Bag</option>
            <option value="perfume">Perfume</option>
        </select>
    </div>

    <div class="products">

        <div class="product" data-name="Soriko Soap" data-category="soap">
            <h3>Soriko Soap</h3>
            <p>Soap</p>
            <p>₱170</p>
        </div>

        <div class="product" data-name="Emilio Bag" data-category="bag">
            <h3>Emilio Bag</h3>
            <p>Bag</p>
            <p>₱3,950</p>
        </div>

        <div class="product" data-name="Rose Perfume" data-category="perfume">
            <h3>Rose Perfume</h3>
            <p>Perfume</p>
            <p>₱670</p>
        </div>

    </div>

    <script>
        const search = document.getElementById("search");
        const filter = document.getElementById("filter");
        const products = document.querySelectorAll(".product");

        function filterProducts() {
            const text = search.value.toLowerCase();
            const category = filter.value;

            products.forEach(product => {
                const name = product.dataset.name.toLowerCase();
                const productCategory = product.dataset.category;

                const searchMatch = name.includes(text);
                const categoryMatch =
                    category === "all" || productCategory === category;

                product.style.display =
                    searchMatch && categoryMatch ? "block" : "none";
            });
        }

        search.addEventListener("input", filterProducts);
        filter.addEventListener("change", filterProducts);
    </script>

</body>
</html>
