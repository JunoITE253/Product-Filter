```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Luxe - Categories</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f8f6f3;
            color: #333;
        }

        .header {
            background: #ffffff;
            padding: 20px 50px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #e5e5e5;
        }

        .logo {
            font-size: 26px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .header-title {
            font-size: 20px;
            font-weight: 600;
        }

        .container {
            max-width: 1100px;
            margin: 50px auto;
            padding: 0 25px;
        }

        .page-title {
            text-align: center;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 40px;
        }

        .category-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .category-button {
            height: 180px;
            border: none;
            border-radius: 15px;
            background: #ffffff;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            transition: 0.25s ease;
        }

        .category-button:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 22px rgba(0,0,0,0.12);
        }

        .category-icon {
            font-size: 45px;
        }

        .category-name {
            font-size: 20px;
            font-weight: 600;
        }

        .category-description {
            font-size: 13px;
            color: #888;
        }

        @media (max-width: 800px) {
            .category-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 500px) {
            .category-grid {
                grid-template-columns: 1fr;
            }

            .header {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <header class="header">
        <div class="logo">LOVE LUXE</div>
        <div class="header-title">Categories</div>
    </header>

    <main class="container">

        <h1 class="page-title">Shop by Category</h1>

        <p class="subtitle">
            Choose a category to explore our collection
        </p>

        <div class="category-grid">

            <button class="category-button" onclick="categoryClicked('Clothes')">
                <div class="category-icon">👗</div>
                <div class="category-name">Clothes</div>
                <div class="category-description">Fashion & Apparel</div>
            </button>

            <button class="category-button" onclick="categoryClicked('Shoes')">
                <div class="category-icon">👟</div>
                <div class="category-name">Shoes</div>
                <div class="category-description">Footwear Collection</div>
            </button>

            <button class="category-button" onclick="categoryClicked('Bags')">
                <div class="category-icon">👜</div>
                <div class="category-name">Bags</div>
                <div class="category-description">Bags & Accessories</div>
            </button>

            <button class="category-button" onclick="categoryClicked('Accessories')">
                <div class="category-icon">💎</div>
                <div class="category-name">Accessories</div>
                <div class="category-description">Jewelry & More</div>
            </button>

            <button class="category-button" onclick="categoryClicked('Beauty')">
                <div class="category-icon">💄</div>
                <div class="category-name">Beauty</div>
                <div class="category-description">Beauty Products</div>
            </button>

            <button class="category-button" onclick="categoryClicked('Others')">
                <div class="category-icon">✨</div>
                <div class="category-name">Others</div>
                <div class="category-description">More Products</div>
            </button>

        </div>

    </main>

    <script>
        function categoryClicked(category) {
            alert(category + " category selected.");
        }
    </script>

</body>
</html>
```
