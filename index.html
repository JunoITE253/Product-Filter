<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Luxe Categories</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f8f6f3;
            margin: 0;
            padding: 40px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .categories {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            max-width: 900px;
            margin: auto;
        }

        .category {
            background: white;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            font-size: 18px;
        }

        .category:hover {
            background: #f0f0f0;
        }

        .icon {
            font-size: 30px;
            color: black;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>

    <h1>Categories</h1>

    <div class="categories">

        <button class="category">
            <div class="icon">♧</div>
            Clothes
        </button>

        <button class="category">
            <div class="icon">⌁</div>
            Shoes
        </button>

        <button class="category">
            <div class="icon">□</div>
            Bags
        </button>

        <button class="category">
            <div class="icon">◇</div>
            Accessories
        </button>

        <button class="category">
            <div class="icon">○</div>
            Beauty
        </button>

        <button class="category">
            <div class="icon">•••</div>
            Others
        </button>

    </div>

</body>
</html>
