<!DOCTYPE html>
<html>
<head>
    <title>Machine Problem 6</title>
</head>
<body>

<h2>Machine Problem 6</h2>

<input id="item" placeholder="Item Name"><br><br>
<input id="quantity" type="number" placeholder="Quantity"><br><br>
<input id="price" type="number" placeholder="Price"><br><br>

<button onclick="add()">Add</button>
<button onclick="cancel()">Cancel Update</button>

<p id="message"></p>

<table border="1">
    <tr>
        <th>CTR</th>
        <th>Item</th>
        <th>Quantity</th>
        <th>Price</th>
        <th>Total Price</th>
        <th>Actions</th>
    </tr>

    <tbody id="list"></tbody>

    <tr>
        <td colspan="4">Grand Total</td>
        <td id="grandTotal">0</td>
        <td></td>
    </tr>
</table>

<script>

let records = [];
let ctr = 10001;
let edit = -1;

function add() {

    let item = document.getElementById("item").value;
    let quantity = Number(document.getElementById("quantity").value);
    let price = Number(document.getElementById("price").value);

    if (quantity <= 0) {
        document.getElementById("message").innerHTML =
            "Quantity must be greater than zero.";
        return;
    }

    if (price <= 0) {
        document.getElementById("message").innerHTML =
            "Price must be greater than zero.";
        return;
    }

    if (edit == -1) {

        records.push({
            ctr: ctr,
            item: item,
            quantity: quantity,
            price: price,
            total: quantity * price
        });

        document.getElementById("message").innerHTML =
            "Record " + ctr + " was added successfully.";

        ctr++;

    } else {

        records[edit].item = item;
        records[edit].quantity = quantity;
        records[edit].price = price;
        records[edit].total = quantity * price;

        document.getElementById("message").innerHTML =
            "Record was updated successfully.";

        edit = -1;
    }

    clear();
    display();
}

function display() {

    let list = document.getElementById("list");
    list.innerHTML = "";

    let grandTotal = 0;

    for (let i = 0; i < records.length; i++) {

        grandTotal += records[i].total;

        list.innerHTML +=
            "<tr>" +
            "<td>" + records[i].ctr + "</td>" +
            "<td>" + records[i].item + "</td>" +
            "<td>" + records[i].quantity + "</td>" +
            "<td>" + records[i].price + "</td>" +
            "<td>" + records[i].total + "</td>" +
            "<td>" +
            "<button onclick='update(" + i + ")'>Update</button>" +
            "<button onclick='remove(" + i + ")'>Delete</button>" +
            "</td>" +
            "</tr>";
    }

    document.getElementById("grandTotal").innerHTML =
        grandTotal;
}

function update(i) {

    edit = i;

    document.getElementById("item").value =
        records[i].item;

    document.getElementById("quantity").value =
        records[i].quantity;

    document.getElementById("price").value =
        records[i].price;

    document.getElementById("message").innerHTML =
        "You are updating record " + records[i].ctr + ".";
}

function remove(i) {

    let id = records[i].ctr;

    records.splice(i, 1);

    document.getElementById("message").innerHTML =
        "Record " + id + " was deleted successfully.";

    display();
}

function cancel() {

    edit = -1;

    clear();

    document.getElementById("message").innerHTML =
        "Update was cancelled.";
}

function clear() {

    document.getElementById("item").value = "";
    document.getElementById("quantity").value = "";
    document.getElementById("price").value = "";
}

</script>

</body>
</html>
